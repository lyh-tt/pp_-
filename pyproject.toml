[project]
name = "pp-rve-rpt-texgen"
version = "0.1.0"
description = "Parametric TexGen modeling for prepreg unit cells"
readme = "README.md"
authors = [
    { name = "lyh", email = "2415258048@qq.com" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.5",
    "pandas>=3.1.1",
    "pyside6-essentials>=6.12.0",
]

[project.gui-scripts]
pp-rve-rpt-texgen = "texgen.ui:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "texgen"

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
    "pytest>=9.2.0",
]
